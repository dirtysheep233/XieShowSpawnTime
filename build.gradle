plugins {
    id 'fabric-loom' version '1.17.13'
    id 'maven-publish'
}

version = "2.1.1+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    include(modImplementation("io.github.llamalad7:mixinextras-fabric:0.5.4"))
}

sourceSets {
    main {
        java {
            srcDirs = ['src/fabric/java', layout.buildDirectory.dir('generated/compat/java')]
            def versionParts = project.minecraft_version.tokenize('.').collect { it as int }
            def patchVersion = versionParts.size() >= 3 && versionParts[0] == 1 && versionParts[1] == 21 ? versionParts[2] : 0
            if (patchVersion >= 9) {
                exclude 'com/seosean/showspawntime/mixin/LivingEntityRendererMixin.java'
                exclude 'com/seosean/showspawntime/mixin/PlayerEntityRendererMixin.java'
            }
        }
        resources {
            srcDirs = ['src/main/resources', 'src/fabric/resources']
            exclude 'mcmod.info'
            exclude 'mixins.showspawntime.json'
            exclude 'assets/showspawntime/font/glyph_sizes.bin'
        }
    }
}

processResources {
    inputs.property 'version', project.version
    def minecraftConstraint = project.findProperty('minecraft_constraint') ?: "=${project.minecraft_version}"
    def versionParts = project.minecraft_version.tokenize('.').collect { it as int }
    def patchVersion = versionParts.size() >= 3 && versionParts[0] == 1 && versionParts[1] == 21 ? versionParts[2] : 0
    def modernRenderer = patchVersion >= 9
    inputs.property 'minecraft_constraint', minecraftConstraint
    inputs.property 'modern_renderer', modernRenderer
    filesMatching('fabric.mod.json') {
        expand 'version': project.version,
                'minecraft_version': project.minecraft_version,
                'minecraft_constraint': minecraftConstraint,
                'loader_version': project.loader_version,
                'fabric_version': project.fabric_version
    }
    filesMatching('showspawntime.mixins.json') {
        expand 'living_entity_renderer_mixin': modernRenderer
                        ? 'LivingEntityRendererModernMixin' : 'LivingEntityRendererMixin',
                'player_entity_renderer_mixin': modernRenderer
                        ? 'PlayerEntityRendererModernMixin' : 'PlayerEntityRendererMixin'
    }
}

tasks.register('generateCompatSource') {
    def outputDir = layout.buildDirectory.dir('generated/compat/java/com/seosean/showspawntime')
    inputs.property 'minecraft_version', project.minecraft_version
    outputs.dir(outputDir)
    doLast {
        def directory = outputDir.get().asFile
        project.delete(directory)
        directory.mkdirs()
        def versionParts = project.minecraft_version.tokenize('.').collect { it as int }
        def patchVersion = versionParts.size() >= 3 && versionParts[0] == 1 && versionParts[1] == 21 ? versionParts[2] : 0
        def is1219OrNewer = patchVersion >= 9
        def is12111OrNewer = patchVersion >= 11
        def importLine = is12111OrNewer ? 'import net.minecraft.client.render.RenderLayers;' : ''
        def expression = is12111OrNewer
                ? 'RenderLayers.entityTranslucent(texture)'
                : 'RenderLayer.getEntityTranslucent(texture)'
        new File(directory, 'KeyBindingCompat.java').text = is1219OrNewer ? """package com.seosean.showspawntime;

import net.minecraft.client.option.KeyBinding;
import net.minecraft.client.util.InputUtil;
import net.minecraft.util.Identifier;

public final class KeyBindingCompat {
    private static final KeyBinding.Category CATEGORY = KeyBinding.Category.create(
            Identifier.of("showspawntime", "main"));

    private KeyBindingCompat() {
    }

    public static KeyBinding create(String translationKey, int keyCode) {
        return new KeyBinding(translationKey, InputUtil.Type.KEYSYM, keyCode, CATEGORY);
    }
}
""" : """package com.seosean.showspawntime;

import net.minecraft.client.option.KeyBinding;
import net.minecraft.client.util.InputUtil;

public final class KeyBindingCompat {
    private KeyBindingCompat() {
    }

    public static KeyBinding create(String translationKey, int keyCode) {
        return new KeyBinding(translationKey, InputUtil.Type.KEYSYM, keyCode,
                "key.categories.showspawntime");
    }
}
"""
        new File(directory, 'HudEditorCompatScreen.java').text = is1219OrNewer ? """package com.seosean.showspawntime;

import net.minecraft.client.gui.Click;
import net.minecraft.client.gui.screen.Screen;
import net.minecraft.text.Text;

public abstract class HudEditorCompatScreen extends Screen {
    protected HudEditorCompatScreen(Text title) {
        super(title);
    }

    @Override
    public boolean mouseClicked(Click click, boolean doubled) {
        return onMouseClicked(click.x(), click.y(), click.button()) || super.mouseClicked(click, doubled);
    }

    @Override
    public boolean mouseDragged(Click click, double deltaX, double deltaY) {
        return onMouseDragged(click.x(), click.y(), click.button()) || super.mouseDragged(click, deltaX, deltaY);
    }

    @Override
    public boolean mouseReleased(Click click) {
        return onMouseReleased(click.x(), click.y(), click.button()) || super.mouseReleased(click);
    }

    protected abstract boolean onMouseClicked(double mouseX, double mouseY, int button);
    protected abstract boolean onMouseDragged(double mouseX, double mouseY, int button);
    protected abstract boolean onMouseReleased(double mouseX, double mouseY, int button);
}
""" : """package com.seosean.showspawntime;

import net.minecraft.client.gui.screen.Screen;
import net.minecraft.text.Text;

public abstract class HudEditorCompatScreen extends Screen {
    protected HudEditorCompatScreen(Text title) {
        super(title);
    }

    @Override
    public boolean mouseClicked(double mouseX, double mouseY, int button) {
        return onMouseClicked(mouseX, mouseY, button) || super.mouseClicked(mouseX, mouseY, button);
    }

    @Override
    public boolean mouseDragged(double mouseX, double mouseY, int button, double deltaX, double deltaY) {
        return onMouseDragged(mouseX, mouseY, button) || super.mouseDragged(mouseX, mouseY, button, deltaX, deltaY);
    }

    @Override
    public boolean mouseReleased(double mouseX, double mouseY, int button) {
        return onMouseReleased(mouseX, mouseY, button) || super.mouseReleased(mouseX, mouseY, button);
    }

    protected abstract boolean onMouseClicked(double mouseX, double mouseY, int button);
    protected abstract boolean onMouseDragged(double mouseX, double mouseY, int button);
    protected abstract boolean onMouseReleased(double mouseX, double mouseY, int button);
}
"""
        new File(directory, 'TranslucentRenderLayer.java').text = """package com.seosean.showspawntime;

import net.minecraft.client.render.RenderLayer;
${importLine}
import net.minecraft.util.Identifier;

public final class TranslucentRenderLayer {
    private TranslucentRenderLayer() {
    }

    public static RenderLayer forTexture(Identifier texture) {
        return ${expression};
    }
}
"""
        if (is1219OrNewer) {
            def mixinDirectory = new File(directory, 'mixin')
            mixinDirectory.mkdirs()
            new File(mixinDirectory, 'LivingEntityRendererModernMixin.java').text = """package com.seosean.showspawntime.mixin;

import com.seosean.showspawntime.PlayerRenderStateAlpha;
import com.seosean.showspawntime.TranslucentRenderLayer;
import net.minecraft.client.render.RenderLayer;
import net.minecraft.client.render.entity.LivingEntityRenderer;
import net.minecraft.client.render.entity.state.LivingEntityRenderState;
import net.minecraft.client.render.entity.state.PlayerEntityRenderState;
import net.minecraft.util.math.ColorHelper;
import org.spongepowered.asm.mixin.Mixin;
import org.spongepowered.asm.mixin.injection.At;
import org.spongepowered.asm.mixin.injection.Inject;
import org.spongepowered.asm.mixin.injection.callback.CallbackInfoReturnable;

@Mixin(LivingEntityRenderer.class)
public abstract class LivingEntityRendererModernMixin {
    @Inject(method = "getRenderLayer(Lnet/minecraft/client/render/entity/state/LivingEntityRenderState;ZZZ)Lnet/minecraft/client/render/RenderLayer;",
            at = @At("RETURN"), cancellable = true)
    private void showspawntime\$useTranslucentLayer(LivingEntityRenderState state, boolean showBody,
                                                     boolean translucent, boolean showOutline,
                                                     CallbackInfoReturnable<RenderLayer> cir) {
        if (state instanceof PlayerEntityRenderState playerState) {
            float alpha = ((PlayerRenderStateAlpha) playerState).showspawntime\$getAlpha();
            if (alpha < 1.0F && cir.getReturnValue() != null) {
                cir.setReturnValue(TranslucentRenderLayer.forTexture(((LivingEntityRenderer) (Object) this).getTexture(state)));
            }
        }
    }

    @Inject(method = "getMixColor(Lnet/minecraft/client/render/entity/state/LivingEntityRenderState;)I",
            at = @At("RETURN"), cancellable = true)
    private void showspawntime\$applyAlpha(LivingEntityRenderState state,
                                            CallbackInfoReturnable<Integer> cir) {
        if (state instanceof PlayerEntityRenderState playerState) {
            float alpha = ((PlayerRenderStateAlpha) playerState).showspawntime\$getAlpha();
            if (alpha < 1.0F) {
                cir.setReturnValue(ColorHelper.withAlpha((int) (alpha * 255.0F), cir.getReturnValue()));
            }
        }
    }
}
"""
            new File(mixinDirectory, 'PlayerEntityRendererModernMixin.java').text = """package com.seosean.showspawntime.mixin;

import com.seosean.showspawntime.PlayerAlphaCompat;
import com.seosean.showspawntime.PlayerRenderStateAlpha;
import net.minecraft.client.render.command.OrderedRenderCommandQueue;
import net.minecraft.client.render.entity.PlayerEntityRenderer;
import net.minecraft.client.render.entity.state.PlayerEntityRenderState;
import net.minecraft.client.render.state.CameraRenderState;
import net.minecraft.client.util.math.MatrixStack;
import net.minecraft.entity.PlayerLikeEntity;
import org.spongepowered.asm.mixin.Mixin;
import org.spongepowered.asm.mixin.injection.At;
import org.spongepowered.asm.mixin.injection.Inject;
import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;
import org.spongepowered.asm.mixin.injection.callback.CallbackInfoReturnable;

@Mixin(PlayerEntityRenderer.class)
public abstract class PlayerEntityRendererModernMixin {
    @Inject(method = "updateRenderState(Lnet/minecraft/entity/PlayerLikeEntity;Lnet/minecraft/client/render/entity/state/PlayerEntityRenderState;F)V",
            at = @At("TAIL"))
    private void showspawntime\$updateRenderState(PlayerLikeEntity player, PlayerEntityRenderState state,
                                                   float tickProgress, CallbackInfo ci) {
        float alpha = PlayerAlphaCompat.alpha(player);
        ((PlayerRenderStateAlpha) state).showspawntime\$setAlpha(alpha);
        if (alpha <= 0.0F) {
            state.onFire = false;
            state.invisible = true;
            state.invisibleToPlayer = true;
        }
    }
}
"""
            new File(directory, 'PlayerAlphaCompat.java').text = """package com.seosean.showspawntime;

import net.minecraft.client.MinecraftClient;
import net.minecraft.entity.PlayerLikeEntity;

public final class PlayerAlphaCompat {
    private PlayerAlphaCompat() {
    }

    public static float alpha(PlayerLikeEntity player) {
        MinecraftClient client = MinecraftClient.getInstance();
        if (!ShowSpawnTimeClient.CONFIG.playerInvisible || client.player == null || player == client.player
                || player.isSleeping() || player.getMaxHealth() >= 100 || client.player.distanceTo(player) >= 7.71F) {
            return 1.0F;
        }
        float distance = client.player.distanceTo(player);
        if (distance < 1.4F) return 0.0F;
        if (distance <= 4.0F) return 0.0533F * distance + 0.0258F;
        if (distance <= 6.0F) return 0.15F * distance - 0.4126F;
        return 0.3F * distance - 1.313F;
    }
}
"""
        }
    }
}

compileJava.dependsOn generateCompatSource
tasks.matching { it.name == 'sourcesJar' }.configureEach {
    dependsOn generateCompatSource
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
    from('LICENSE_ZombiesAutoSplits')
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
